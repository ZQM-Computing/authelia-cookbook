name: Example validation

on:
  pull_request:
    paths:
      - "examples/01-isolated-access-control/**"
      - "examples/02-proxy-integration/**"
      - ".github/workflows/example-validation.yml"
      - "README.md"
      - "docs/PROXY-INTEGRATION-TEST-PLAN.md"
  push:
    branches: [main]
    paths:
      - "examples/01-isolated-access-control/**"
      - "examples/02-proxy-integration/**"
      - ".github/workflows/example-validation.yml"
      - "README.md"
      - "docs/PROXY-INTEGRATION-TEST-PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authelia-example-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-compose-runtime:
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run configuration contract tests
        working-directory: examples/01-isolated-access-control
        run: python -m unittest -v test_config_contract.py
      - name: Validate Compose syntax
        working-directory: examples/01-isolated-access-control
        run: docker compose config --quiet
      - name: Validate configuration with the pinned Authelia image
        working-directory: examples/01-isolated-access-control
        shell: bash
        run: |
          set -euo pipefail
          # The checkout lives inside the runner container and is not visible to
          # the Docker daemon, so the config is copied into a created container
          # ...instead of bind-mounted. Only the whole-directory form creates a
          # missing parent (/config); copying a single file fails with
          # "Could not find the file /config in container".
          cid="$(docker create authelia/authelia:4.39.28 authelia config validate --config /config/configuration.yml)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD" "$cid:/config"
          docker start -a "$cid"
      - name: Generate an ephemeral valid demo password hash
        working-directory: examples/01-isolated-access-control
        shell: bash
        run: |
          set -euo pipefail
          demo_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          password_file="$RUNNER_TEMP/authelia-demo-password"
          printf '%s' "$demo_password" > "$password_file"
          chmod 600 "$password_file"
          echo "DEMO_PASSWORD_FILE=$password_file" >> "$GITHUB_ENV"
          hash_output="$(docker run --rm authelia/authelia:4.39.28 authelia crypto hash generate argon2 --password "$demo_password")"
          password_hash="$(printf '%s\n' "$hash_output" | sed -n 's/^Digest: //p' | head -n 1)"
          if [[ "$password_hash" != \$argon2* ]]; then
            echo "Authelia CLI did not return an Argon2 digest in the expected format." >&2
            printf '%s\n' "$hash_output" >&2
            exit 1
          fi
          DEMO_HASH="$password_hash" python - <<'PY'
          import os
          from pathlib import Path
          path = Path("users_database.yml")
          content = path.read_text()
          placeholder = "$argon2id$REPLACE_WITH_A_REAL_AUTHELIA_GENERATED_HASH"
          if placeholder not in content:
              raise SystemExit("Expected documented demo hash placeholder was not found.")
          path.write_text(content.replace(placeholder, os.environ["DEMO_HASH"]))
          PY
      - name: Start isolated Authelia service
        working-directory: examples/01-isolated-access-control
        shell: bash
        run: |
          set -euo pipefail
          # The checkout lives inside the runner container and is invisible to
          # the Docker daemon, so compose's "./configuration.yml" volume
          # resolved to a path that does not exist there and Authelia started
          # with an empty config. Bake the fixture into an image instead.
          docker build -q -t ci-authelia-fixture -f - . <<'DOCKERFILE'
          FROM authelia/authelia:4.39.28
          COPY configuration.yml /config/configuration.yml
          COPY users_database.yml /config/users_database.yml
          DOCKERFILE
          docker rm -f authelia-example >/dev/null 2>&1 || true
          docker run -d --name authelia-example \
            -p 127.0.0.1:9091:9091 \
            ci-authelia-fixture \
            authelia --config /config/configuration.yml
      - name: Verify runtime health endpoint
        working-directory: examples/01-isolated-access-control
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9091/api/health; then
              printf '\nAuthelia health endpoint responded successfully.\n'
              exit 0
            fi
            sleep 2
          done
          echo "Authelia did not become healthy within 60 seconds." >&2
          docker logs authelia-example
          exit 1
      - name: Validate isolated Caddy proxy configuration
        working-directory: examples/02-proxy-integration
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD" "$cid:/etc/caddy"
          docker start -a "$cid"
      - name: Validate fixture Authelia configuration
        working-directory: examples/02-proxy-integration
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create authelia/authelia:4.39.28 authelia config validate --config /config/configuration.yml)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          # First copy creates /config; the second file can then be placed in it.
          docker cp "$PWD/../01-isolated-access-control" "$cid:/config"
          docker cp "$PWD/authelia-configuration.yml" "$cid:/config/configuration.yml"
          docker start -a "$cid"
      - name: Validate proxy fixture Compose topology
        working-directory: examples/02-proxy-integration
        run: docker compose config --quiet
      - name: Start isolated proxy fixture
        working-directory: examples/02-proxy-integration
        shell: bash
        run: |
          set -euo pipefail
          # Same daemon-visibility problem as above: every service bind-mounts
          # a file from the checkout. Build throwaway images that already
          # contain those files, then run them from a generated compose file.
          export CADDY_HTTP_PORT="${CADDY_HTTP_PORT:-28080}"
          export CADDY_HTTPS_PORT="${CADDY_HTTPS_PORT:-28443}"
          echo "CADDY_HTTP_PORT=$CADDY_HTTP_PORT" >> "$GITHUB_ENV"
          echo "CADDY_HTTPS_PORT=$CADDY_HTTPS_PORT" >> "$GITHUB_ENV"

          docker build -q -t ci-caddy -f - . <<'DOCKERFILE'
          FROM caddy:2.10.2
          COPY Caddyfile /etc/caddy/Caddyfile
          DOCKERFILE

          docker build -q -t ci-public-app -f - . <<'DOCKERFILE'
          FROM nginx:1.29.3-alpine
          COPY public.html /usr/share/nginx/html/index.html
          DOCKERFILE

          docker build -q -t ci-protected-app -f - . <<'DOCKERFILE'
          FROM python:3.13.7-alpine3.22
          COPY protected_server.py /app/server.py
          DOCKERFILE

          docker build -q -t ci-authelia -f - "$GITHUB_WORKSPACE" <<'DOCKERFILE'
          FROM authelia/authelia:4.39.28
          COPY examples/02-proxy-integration/authelia-configuration.yml /config/configuration.yml
          COPY examples/01-isolated-access-control/users_database.yml /config/users_database.yml
          DOCKERFILE

          cat > ci-compose.yaml <<'YAML'
          services:
            caddy:
              image: ci-caddy
              ports:
                - "127.0.0.1:${CADDY_HTTP_PORT}:8080"
                - "127.0.0.1:${CADDY_HTTPS_PORT}:8443"
              networks: [proxy-test]
            authelia:
              image: ci-authelia
              command: ["authelia", "--config", "/config/configuration.yml"]
              networks: [proxy-test]
            public-app:
              image: ci-public-app
              networks: [proxy-test]
            protected-app:
              image: ci-protected-app
              command: ["python", "/app/server.py"]
              networks: [proxy-test]
          networks:
            proxy-test:
              internal: true
          YAML

          docker compose -f ci-compose.yaml down --remove-orphans >/dev/null 2>&1 || true
          docker compose -f ci-compose.yaml up -d --no-build
      - name: Test proxy routing and authorization boundary
        working-directory: examples/02-proxy-integration
        run: python -m unittest -v test_proxy_smoke.py
      - name: Collect proxy fixture logs on failure
        if: failure()
        working-directory: examples/02-proxy-integration
        run: docker compose -f ci-compose.yaml logs --no-color
      - name: Stop proxy fixture
        if: always()
        working-directory: examples/02-proxy-integration
        run: docker compose -f ci-compose.yaml down --volumes --remove-orphans
      - name: Remove ephemeral demo credential file
        if: always()
        shell: bash
        run: rm -f "${DEMO_PASSWORD_FILE:-}"
      - name: Stop isolated service
        if: always()
        shell: bash
        run: docker rm -f authelia-example >/dev/null 2>&1 || true
