name: Example validation

on:
  pull_request:
    paths:
      - "examples/01-isolated-access-control/**"
      - ".github/workflows/example-validation.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "examples/01-isolated-access-control/**"
      - ".github/workflows/example-validation.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authelia-example-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-compose-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run configuration contract tests
        working-directory: examples/01-isolated-access-control
        run: python -m unittest -v test_config_contract.py
      - name: Validate Compose syntax
        working-directory: examples/01-isolated-access-control
        run: docker compose config --quiet
      - name: Validate configuration with the pinned Authelia image
        working-directory: examples/01-isolated-access-control
        run: >-
          docker run --rm
          --volume "$PWD:/config:ro"
          authelia/authelia:4.39.28
          authelia config validate --config /config/configuration.yml
      - name: Start isolated Authelia service
        working-directory: examples/01-isolated-access-control
        run: docker compose up -d --no-build
      - name: Verify runtime health endpoint
        working-directory: examples/01-isolated-access-control
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9091/api/health; then
              printf '\nAuthelia health endpoint responded successfully.\n'
              exit 0
            fi
            sleep 2
          done
          echo "Authelia did not become healthy within 60 seconds." >&2
          docker compose logs --no-color authelia
          exit 1
      - name: Stop isolated service
        if: always()
        working-directory: examples/01-isolated-access-control
        run: docker compose down --volumes --remove-orphans
