# Demonstration-only identity. Replace the placeholder hash with a hash
# generated by the Authelia CLI before attempting authentication.
# Never reuse real usernames, passwords, or hashes in a cookbook.
users:
  demo:
    displayname: "Demo User"
    # Intentionally invalid placeholder: authentication must fail until replaced.
    password: "$argon2id$REPLACE_WITH_A_REAL_AUTHELIA_GENERATED_HASH"
    email: "demo@example.test"
    groups:
      - "demo-users"
