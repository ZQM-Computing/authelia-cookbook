theme: auto
server:
  address: tcp://0.0.0.0:9091/
log:
  level: info
totp:
  issuer: example.test
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
access_control:
  default_policy: deny
  rules:
    - domain: "public.example.test"
      policy: bypass
    - domain: "protected.example.test"
      policy: one_factor
session:
  secret: "replace-this-local-demo-session-secret-before-use"
  cookies:
    - domain: "example.test"
      authelia_url: "https://auth.example.test"
      default_redirection_url: "https://protected.example.test"
      same_site: lax
regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m
identity_validation:
  reset_password:
    jwt_secret: "synthetic-demo-jwt-secret-change-before-use-0123456789abcdef"
storage:
  encryption_key: "synthetic-demo-storage-encryption-key-change-before-use"
  local:
    path: /config/db.sqlite3
notifier:
  filesystem:
    filename: /config/notification.txt
