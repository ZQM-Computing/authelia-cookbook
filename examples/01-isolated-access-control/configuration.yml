theme: auto
server:
  address: tcp://0.0.0.0:9091/
log:
  level: info
totp:
  issuer: example.test
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
access_control:
  default_policy: deny
  rules:
    - domain: "public.example.test"
      policy: bypass
    - domain: "protected.example.test"
      policy: one_factor
session:
  secret: "replace-this-local-demo-session-secret-before-use"
  cookies:
    - domain: "example.test"
      authelia_url: "http://auth.example.test:9091"
      default_redirection_url: "http://protected.example.test"
      same_site: lax
regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m
storage:
  local:
    path: /config/db.sqlite3
notifier:
  filesystem:
    filename: /config/notification.txt
